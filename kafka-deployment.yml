apiVersion: apps/v1
kind: StatefulSet 
metadata:
  labels:
    app.kubernetes.io/name: kafka-zoo
  name: kafka-zoo
  namespace: kafka-sr-demo
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-zoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-zoo
    spec:
      hostname: kafka-zoo
      containers:
        - name: kafka-zoo
          image: bitnami/kafka:latest
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_CFG_ZOOKEEPER_CONNECT  
              value: "zook1:2181"
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://kafka:9092,CONTROLLER://kafka-zoo:29093
            - name: KAFKA_CFG_PROCESS_ROLES
              value: broker, controller
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka-zoo:29093
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CLUSTER_ID
              value: "leCZlcmaTJCzpipgOs9UPw"
            - name:  ALLOW_PLAINTEXT_LISTENER
              value: "yes"
