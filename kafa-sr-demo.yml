# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-sr-demo

# Zookeeper
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: kafka-sr-demo
spec:
  ports:
  - name: client
    port: 2181
    targetPort: client
  clusterIP: None
  selector:
    app.kubernetes.io/name: zook1

# ------
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: zook1
  namespace: kafka-sr-demo
spec:
  serviceName: zookeeper
  replicas: 1
  matchLabels:
    app.kubernetes.io/name: zook1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zook1
    spec:
      containers:
      - name: zook1
        image: bitnami/zookeeper:3.9.2
        ports:
          - name: client
            containerPort: 2181
        env:
        - name: ALLOW_ANONYMOUS_LOGIN
          value: "yes"


# kafka service 
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka-sr-demo
  labels:
    app.kubernetes.io/name: kafka
spec:
  ports:
  - name: broker
    port: 9092
    targetPort: 9092
  clusterIP: None
  selector:
    app.kubernetes.io/name: kafka-zoo

# ---
apiVersion: apps/v1
kind: StatefulSet 
metadata:
  labels:
    app.kubernetes.io/name: kafka-zoo
  name: kafka-zoo
  namespace: kafka-sr-demo
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-zoo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-zoo
    spec:
      hostname: kafka-zoo
      containers:
        - name: kafka-zoo
          image: bitnami/kafka:3.7.0
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_CFG_ZOOKEEPER_CONNECT  
              value: "zook1:2181"
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_CFG_LISTENERS
              value: PLAINTEXT://:9092
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka-zoo.kafka.kafka-sr-demo.svc.cluster.local:9092
            - name:  ALLOW_PLAINTEXT_LISTENER
              value: "yes"
                  
# Schema registry
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: kafka-sr-demo
spec:
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  selector:
    app.kubernetes.io/name: schema-registry

# ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: kafka-sr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schema-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schema-registry
    spec:
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.6.0
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: SCHEMA_REGISTRY_HOST_NAME
              value: schema-registry
            - name: SCHEMA_REGISTRY_LISTENERS
              value: http://0.0.0.0:8081
            - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
              value: PLAINTEXT://kafka-zoo.kafka.kafka-sr-demo.svc.cluster.local:9092
            - name: SCHEMA_REGISTRY_COMPATIBILITY_LEVEL
              value: BACKWARD



# Avro Producer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-producer
  namespace: kafka-sr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-producer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-producer
    spec:
      restartPolicy: Always
      containers:
        - name: producer
          image: docker.io/kingbean99/kafka-sg-producer:latest
          env:
            - name: KAFKA_BROKERS
              value: kafka-zoo:9092
            - name: SCHEMA_REGISTRY_URL
              value: http://schema-registry:8081


# Avro Consumer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-consumer
  namespace: kafka-sr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-consumer
    spec:
      restartPolicy: Always
      containers:
        - name: consumer
          image: docker.io/kingbean99/kafka-sg-consumer
          env:
          - name: KAFKA_BROKERS
            value: kafka-zoo:9092
          - name: SCHEMA_REGISTRY_URL
            value: http://schema-registry:8081
