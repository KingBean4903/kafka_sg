
apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: zook1
  namespace: kafka-sr-demo
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zook1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zook1
    spec:
      containers:
      - name: zook1
        image: bitnami/zookeeper:latest
        ports:
          - name: client
            containerPort: 2181
        env:
        - name: ALLOW_ANONYMOUS_LOGIN
          value: "yes"
