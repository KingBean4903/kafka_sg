# Avro Consumer
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-consumer
  namespace: kafka-sr-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: video-consumer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: video-consumer
    spec:
      restartPolicy: Always
      containers:
        - name: consumer
          image: docker.io/kingbean99/kafka-sg-consumer:latest
          env:
          - name: KAFKA_BROKERS
            value: kafka-zoo:9092
          - name: SCHEMA_REGISTRY_URL
            value: http://schema-registry:8081

